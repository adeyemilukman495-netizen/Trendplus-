<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in or Join | TrendPulse</title><meta name="description" content="Your TrendPulse account and creator profile."><link rel="stylesheet" href="./features.css?v=20261125-distinct1"></head><body data-feature="profile"><main class="wrap profile-page"><section id="profile-auth" class="auth-screen">
  <a class="auth-brand" href="./" aria-label="TrendPulse home"><span>✦</span> TrendPulse</a>
  <div class="auth-card">
    <div class="auth-heading"><p class="auth-kicker">YOUR COMMUNITY STARTS HERE</p><h1 id="auth-title">Welcome back</h1><p id="auth-subtitle">Sign in to continue to TrendPulse.</p></div>
    <form id="signin-form" class="auth-form">
      <label for="signin-email">Email address</label>
      <input id="signin-email" type="email" required autocomplete="email" placeholder="you@example.com">
      <label for="signin-password">Password</label>
      <div class="password-wrap"><input id="signin-password" type="password" required autocomplete="current-password" placeholder="Enter your password"><button class="password-toggle" type="button" data-toggle-password="signin-password" aria-label="Show password">◉</button></div>
      <button class="auth-forgot" id="forgot-password" type="button">Forgot password?</button>
      <button class="auth-submit" type="submit">Log in</button>
    </form>
    <form id="signup-form" class="auth-form" hidden>
      <label for="signup-name">Display name</label>
      <input id="signup-name" maxlength="40" required placeholder="How should we call you?" autocomplete="name">
      <label for="signup-email">Email address</label>
      <input id="signup-email" type="email" required autocomplete="email" placeholder="you@example.com">
      <label for="signup-password">Password</label>
      <div class="password-wrap"><input id="signup-password" type="password" minlength="8" required autocomplete="new-password" placeholder="At least 8 characters"><button class="password-toggle" type="button" data-toggle-password="signup-password" aria-label="Show password">◉</button></div>
      <p class="auth-hint">Use at least 8 characters.</p>
      <button class="auth-submit" type="submit">Create account</button>
    </form>
    <p class="auth-switch" id="auth-switch">New to TrendPulse? <button type="button" id="show-signup">Sign up</button></p>
    <div class="auth-divider"><span>OR CONTINUE WITH</span></div>
    <button id="profile-google" class="auth-google" type="button"><span class="google-mark">G</span> Continue with Google</button>
    <p class="auth-terms">By continuing, you agree to our <a href="./privacy.html">Privacy Policy</a>.</p>
  </div>
</section>
<section id="profile-panel" class="panel" hidden><div class="profile-panel-head"><h2>Profile details</h2><button id="profile-signout" class="secondary" type="button">Sign out</button></div><form id="profile-form" class="stack"><label for="name">Display name</label><input id="name" maxlength="40" required><label for="username">Username</label><input id="username" maxlength="24" placeholder="unique_username"><label for="bio">Bio</label><textarea id="bio" maxlength="240" placeholder="Tell the community what you enjoy."></textarea><button class="primary" id="save-profile-button" type="submit">Save profile</button></form><h2>Your activity</h2><div id="stats"></div></section><p id="profile-status" class="profile-status" role="status" aria-live="polite" hidden></p><p class="muted small"><a href="./privacy.html">Privacy policy</a></p></main><nav class="shorts-bottom profile-bottom" aria-label="Main navigation"><a href="./">⌂<small>Home</small></a><a href="./catalog.html">⌕<small>Discover</small></a><a href="./shorts.html">▣<small>Shorts</small></a><a href="./community.html">◎<small>Community</small></a><a class="active" href="./profile.html">◉<small>Profile</small></a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script src="./backend-client.js"></script><script src="./features.js?v=20261125-distinct1"></script></body></html>
