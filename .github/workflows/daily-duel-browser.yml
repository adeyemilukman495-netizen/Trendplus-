name: Daily Duel browser smoke tests
on:
  push:
    branches: [main]
    paths:
      - 'challenge.html'
      - 'challenge-game.js'
      - 'backend-client.js'
      - 'supabase-config.js'
      - 'config.js'
      - 'topics.js'
      - 'tests/browser/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/daily-duel-browser.yml'
  pull_request:
    paths:
      - 'challenge.html'
      - 'challenge-game.js'
      - 'backend-client.js'
      - 'supabase-config.js'
      - 'config.js'
      - 'topics.js'
      - 'tests/browser/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/daily-duel-browser.yml'
  workflow_dispatch:
jobs:
  daily-duel-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm install --no-save --package-lock=false
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
