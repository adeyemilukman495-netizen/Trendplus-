name: Apply TrendPulse database migration

on:
  push:
    paths:
      - '.github/workflows/apply-trendpulse-schema.yml'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out TrendPulse
        uses: actions/checkout@v4

      - name: Apply versioned migration to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ndldroodunoxlitifymo
          MIGRATION_FILE: supabase/migrations/20261124230000_trendpulse_initial_schema.sql
          MIGRATION_NAME: 20261124230000_trendpulse_initial_schema
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Missing repository secret SUPABASE_ACCESS_TOKEN."
            exit 1
          fi
          test -s "$MIGRATION_FILE"
          payload_file="$(mktemp)"
          response_file="$(mktemp)"
          jq -n --rawfile query "$MIGRATION_FILE" --arg name "$MIGRATION_NAME" '{query:$query,name:$name}' > "$payload_file"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/migrations" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @"$payload_file")"
          if [ "$status" != "200" ]; then
            echo "Migration failed (HTTP $status)."
            cat "$response_file"
            rm -f "$payload_file" "$response_file"
            exit 1
          fi
          echo "TrendPulse migration applied successfully."
          cat "$response_file"
          rm -f "$payload_file" "$response_file"
