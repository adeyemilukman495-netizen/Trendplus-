name: Supabase connection check

on:
  push:
    paths:
      - '.github/workflows/supabase-connection-check.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: Type CHECK to run a read-only connection test
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'CHECK' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify Supabase Management API access (read-only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ndldroodunoxlitifymo
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Missing repository secret SUPABASE_ACCESS_TOKEN."
            exit 1
          fi

          response_file="$(mktemp)"
          payload_file="$(mktemp)"
          SQL_QUERY="$(cat <<'SQL'
          select json_build_object(
            'existing_tables', coalesce((select json_agg(t.table_name order by t.table_name) from information_schema.tables t where t.table_schema='public' and t.table_name in ('profiles','posts','comments','post_likes','follows','watchlist','reviews','conversations','conversation_members','messages','shorts','fan_clubs','fan_club_members','battles','battle_votes','stories','story_views','reports','blocks','notifications')), '[]'::json),
            'missing_tables', (
              select coalesce(json_agg(expected.table_name order by expected.table_name), '[]'::json)
              from (values
                ('profiles'),('posts'),('comments'),('post_likes'),('follows'),
                ('watchlist'),('reviews'),('conversations'),('conversation_members'),
                ('messages'),('shorts'),('fan_clubs'),('fan_club_members'),('battles'),
                ('battle_votes'),('stories'),('story_views'),('reports'),('blocks'),('notifications')
              ) as expected(table_name)
              where not exists (
                select 1 from information_schema.tables t
                where t.table_schema='public' and t.table_name=expected.table_name
              )
            )
          ) as trendpulse_schema_audit
          from information_schema.tables
          where table_schema='public'
          and table_name in (
            'profiles','posts','comments','post_likes','follows','watchlist','reviews',
            'conversations','conversation_members','messages','shorts','fan_clubs',
            'fan_club_members','battles','battle_votes','stories','story_views',
            'reports','blocks','notifications'
          )
          SQL
          )"
          jq -n --arg query "$SQL_QUERY" '{query:$query,read_only:true}' > "$payload_file"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @"$payload_file")"

          if [ "$status" != "201" ]; then
            echo "Supabase schema audit failed (HTTP $status)."
            cat "$response_file"
            rm -f "$response_file" "$payload_file"
            exit 1
          fi

          echo "Supabase connection succeeded. Read-only schema audit result:"
          cat "$response_file"
          rm -f "$response_file" "$payload_file"
