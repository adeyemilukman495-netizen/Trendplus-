name: Supabase connection check

on:
  push:
    paths:
      - '.github/workflows/supabase-connection-check.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: Type CHECK to run a read-only connection test
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'CHECK' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify Supabase Management API access (read-only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ndldroodunoxlitifymo
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Missing repository secret SUPABASE_ACCESS_TOKEN."
            exit 1
          fi

          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"query":"select json_build_object(\n  'existing_tables', count(*),\n  'missing_tables', (\n    select coalesce(json_agg(expected.table_name order by expected.table_name), '[]'::json)\n    from (values\n      ('profiles'),('posts'),('comments'),('post_likes'),('follows'),\n      ('watchlist'),('reviews'),('conversations'),('conversation_members'),\n      ('messages'),('shorts'),('fan_clubs'),('fan_club_members'),('battles'),\n      ('battle_votes'),('stories'),('story_views'),('reports'),('blocks'),('notifications')\n    ) as expected(table_name)\n    where not exists (\n      select 1 from information_schema.tables t\n      where t.table_schema='public' and t.table_name=expected.table_name\n    )\n  )\n) as trendpulse_schema_audit\nfrom information_schema.tables\nwhere table_schema='public'\nand table_name in (\n  'profiles','posts','comments','post_likes','follows','watchlist','reviews',\n  'conversations','conversation_members','messages','shorts','fan_clubs',\n  'fan_club_members','battles','battle_votes','stories','story_views',\n  'reports','blocks','notifications'\n)","read_only":true}')"

          if [ "$status" != "201" ]; then
            echo "Supabase check failed (HTTP $status)."
            cat "$response_file"
            rm -f "$response_file"
            exit 1
          fi

          echo "Supabase Management API connection succeeded. Read-only schema audit result:"\n          cat "$response_file"
          rm -f "$response_file"
