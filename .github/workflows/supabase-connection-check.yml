name: Supabase post-migration schema verification

on:
  push:
    paths:
      - '.github/workflows/supabase-connection-check.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: Type CHECK to run a read-only connection test
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'CHECK' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify Supabase Management API access (read-only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ndldroodunoxlitifymo
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Missing repository secret SUPABASE_ACCESS_TOKEN."
            exit 1
          fi

          response_file="$(mktemp)"
          payload_file="$(mktemp)"
          SQL_QUERY="$(cat <<'SQL'
          select json_build_object(
            'columns', coalesce((
              select json_agg(json_build_object('table',table_name,'column',column_name,'type',data_type,'nullable',is_nullable,'default',column_default) order by table_name,ordinal_position)
              from information_schema.columns
              where table_schema='public' and table_name in ('profiles','posts','comments','post_likes','follows','watchlist','reviews','conversations','conversation_members','messages','shorts','fan_clubs','fan_club_members','battles','battle_votes','stories','story_views','reports','blocks','notifications')
            ), '[]'::json),
            'policies', coalesce((
              select json_agg(json_build_object('table',tablename,'name',policyname,'command',cmd,'roles',roles,'using',qual,'check',with_check) order by tablename,policyname)
              from pg_policies where schemaname='public'
            ), '[]'::json),
            'rls', coalesce((
              select json_agg(json_build_object('table',c.relname,'enabled',c.relrowsecurity) order by c.relname)
              from pg_class c join pg_namespace n on n.oid=c.relnamespace
              where n.nspname='public' and c.relkind='r'
            ), '[]'::json),
            'missing_tables', (
              select coalesce(json_agg(expected.table_name order by expected.table_name), '[]'::json)
              from (values
                ('profiles'),('posts'),('comments'),('post_likes'),('follows'),
                ('watchlist'),('reviews'),('conversations'),('conversation_members'),
                ('messages'),('shorts'),('fan_clubs'),('fan_club_members'),('battles'),
                ('battle_votes'),('stories'),('story_views'),('reports'),('blocks'),('notifications')
              ) as expected(table_name)
              where not exists (select 1 from information_schema.tables t where t.table_schema='public' and t.table_name=expected.table_name)
            )
          ) as trendpulse_schema_inspection
          SQL
          )"
          jq -n --arg query "$SQL_QUERY" '{query:$query,read_only:true}' > "$payload_file"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @"$payload_file")"

          if [ "$status" != "201" ]; then
            echo "Supabase schema audit failed (HTTP $status)."
            cat "$response_file"
            rm -f "$response_file" "$payload_file"
            exit 1
          fi

          echo "Supabase connection succeeded. Read-only schema audit result:"
          cat "$response_file"
          rm -f "$response_file" "$payload_file"
